
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Défi Conjugaison — Espace professeur</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f3f5f9;
    color: #243047;
    margin: 0;
  }
  header {
    background: #253b63;
    color: white;
    padding: 25px;
  }
  main {
    max-width: 1000px;
    margin: 25px auto;
    padding: 15px;
  }
  .card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px #0001;
  }
  select, button {
    padding: 10px;
    font-size: 16px;
    border-radius: 6px;
  }
  button {
    cursor: pointer;
    background: #253b63;
    color: white;
    border: none;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  th, td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
    text-align: left;
  }
  th { background: #edf1f7; }
  .stats {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
  }
  .stat {
    flex: 1;
    background: #edf1f7;
    padding: 15px;
    border-radius: 8px;
    min-width: 120px;
  }
  .notice {
    background: #fff4d6;
    padding: 12px;
    border-radius: 8px;
  }
</style>
</head>
<body>
<header>
  <h1>Défi Conjugaison</h1>
  <p>Espace professeur — Démonstration</p>
</header>

<main>
  <p class="notice">
    Démonstration avec des élèves et des résultats fictifs.
    Aucun résultat réel n'est enregistré.
  </p>

  <section class="card">
    <h2>Choisir une classe</h2>
    <select id="classe" onchange="afficher()">
      <option value="5e A">5e A</option>
      <option value="4e B">4e B</option>
      <option value="3e C">3e C</option>
    </select>
  </section>

  <section class="card">
    <h2>Vue d'ensemble</h2>
    <div class="stats">
      <div class="stat">
        <strong id="nbEleves">0</strong>
        <p>Élèves</p>
      </div>
      <div class="stat">
        <strong id="moyenne">0 %</strong>
        <p>Réussite moyenne</p>
      </div>
      <div class="stat">
        <strong id="nbSeances">0</strong>
        <p>Séances réalisées</p>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>Résultats des élèves</h2>
    <table>
      <thead>
        <tr>
          <th>Code élève</th>
          <th>Séances</th>
          <th>Réussite</th>
        </tr>
      </thead>
      <tbody id="resultats"></tbody>
    </table>
  </section>
</main>

<script>
const donnees = {
  "5e A": [
    {code:"5A-001", seances:8, score:85},
    {code:"5A-002", seances:6, score:70},
    {code:"5A-003", seances:9, score:92},
    {code:"5A-004", seances:4, score:60}
  ],
  "4e B": [
    {code:"4B-001", seances:7, score:78},
    {code:"4B-002", seances:5, score:65},
    {code:"4B-003", seances:10, score:90},
    {code:"4B-004", seances:6, score:82}
  ],
  "3e C": [
    {code:"3C-001", seances:12, score:88},
    {code:"3C-002", seances:8, score:75},
    {code:"3C-003", seances:11, score:94},
    {code:"3C-004", seances:5, score:68}
  ]
};

function afficher() {
  const classe = document.getElementById("classe").value;
  const eleves = donnees[classe];
  const total = eleves.reduce((s,e) => s + e.score, 0);
  const seances = eleves.reduce((s,e) => s + e.seances, 0);

  document.getElementById("nbEleves").textContent = eleves.length;
  document.getElementById("moyenne").textContent =
    Math.round(total / eleves.length) + " %";
  document.getElementById("nbSeances").textContent = seances;

  document.getElementById("resultats").innerHTML =
    eleves.map(e => `
      <tr>
        <td>${e.code}</td>
        <td>${e.seances}</td>
        <td>${e.score} %</td>
      </tr>
    `).join("");
}
afficher();
</script>
</body>
</html>
